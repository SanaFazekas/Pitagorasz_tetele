<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitagorasz-tétele és alkalmazásai</title>
  <style>
    :root {
      --primary: #2b5c8f;
      --primary-hover: #1d4066;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #dcdfe6;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --accent: #f57c00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 25px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 15px;
    }

    header h1 {
      color: var(--primary);
      font-size: 1.8rem;
    }

    header p {
      color: #666;
      font-size: 0.95rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel h2 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    .form-group input[type="text"], 
    .form-group input[type="number"], 
    .form-group select {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 5px;
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .task-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      background: #fff;
    }

    .task-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .task-description {
      font-size: 1.05rem;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .canvas-container {
      text-align: center;
      margin: 15px 0;
      background: #fafafa;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 15px;
    }

    svg {
      max-width: 100%;
      height: 180px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .input-box label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .input-with-unit {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .input-with-unit input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    .input-with-unit select {
      width: 75px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .root-input-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .root-input-wrapper input {
      width: 50px !important;
      text-align: center;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 0.9rem;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #1b5e20; }

    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }

    .btn-outline { background: transparent; border: 1px solid var(--border); color: #333; }
    .btn-outline:hover { background: #e9ecef; }

    .feedback {
      padding: 15px;
      border-radius: 6px;
      display: none;
      margin-top: 15px;
    }

    .feedback.success {
      display: block;
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .feedback.error {
      display: block;
      background: var(--error-bg);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .solution-steps {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #333;
      background: rgba(255,255,255,0.7);
      padding: 10px;
      border-radius: 4px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .history-table th, .history-table td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-size: 0.9rem;
    }

    .history-table th {
      background: #f4f7f9;
    }

    .tag-success { color: var(--success); font-weight: bold; }
    .tag-error { color: var(--error); font-weight: bold; }

    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Pitagorasz-tétele és alkalmazásai</h1>
    <p>Interaktív matematika feladatgeneráló és gyakorló alkalmazás</p>
  </header>

  <div class="main-grid">
    <aside class="panel">
      <div>
        <h2>Beállítások</h2>

        <div class="form-group">
          <label for="studentName">Tanuló neve:</label>
          <input type="text" id="studentName" placeholder="Pl. Kovács Péter">
        </div>

        <div class="form-group">
          <label for="shapeType">Alakzat / Téma:</label>
          <select id="shapeType">
            <option value="random">Véletlenszerű / Vegyes</option>
            <option value="right_triangle">Derékszögű háromszög</option>
            <option value="isosceles_triangle">Egyenlőszárú háromszög</option>
            <option value="square">Négyzet</option>
            <option value="rectangle">Téglalap</option>
            <option value="trapezoid">Trapéz</option>
            <option value="rhombus_deltoid">Rombusz / Deltoid</option>
            <option value="parallelogram">Paralelogramma (Romboid)</option>
            <option value="circle">Kör (húr és sugár)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="calcGoal">Keresett érték:</label>
          <select id="calcGoal">
            <option value="random">Vegyes (Befogó vagy Átfogó)</option>
            <option value="hypotenuse">Átfogó számítása (c)</option>
            <option value="leg">Befogó számítása (a vagy b)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="checkbox-group">
            <input type="checkbox" id="useRootFormat" onchange="renderTask()"> Gyökös kiírás / pontos alak (pl. a√b)
          </label>
        </div>

        <div class="button-group" style="flex-direction: column;">
          <button class="btn-primary" onclick="generateTask()">Új feladat generálása</button>
          <button class="btn-outline" onclick="openHistoryModal()">Gyakorlásom</button>
        </div>
      </div>

      <div style="margin-top: 25px;">
        <button class="btn-secondary" style="width: 100%;" onclick="resetForm()">Adatok törlése</button>
      </div>
    </aside>

    <main class="workspace">
      <div class="task-card">
        <div class="task-title" id="taskTitle">Feladat</div>
        <div class="task-description" id="taskText">Töltsd ki a bal oldali paneleket és kattints az "Új feladat generálása" gombra!</div>
        
        <div class="canvas-container" id="canvasContainer">
          <svg id="shapeSvg" viewBox="0 0 300 160">
            <!-- Dinamikus SVG -->
          </svg>
        </div>

        <div class="inputs-grid" id="inputsGrid"></div>

        <div class="button-group" style="margin-top: 20px;">
          <button class="btn-success" onclick="checkAnswer()">ELLENŐRZÉS</button>
          <button class="btn-outline" onclick="generateTask()">Tovább új feladatra</button>
        </div>

        <div id="feedback" class="feedback"></div>
      </div>
    </main>
  </div>
</div>

<div id="historyModal" class="modal">
  <div class="modal-content" id="printableArea">
    <div class="modal-header">
      <h2 id="modalStudentName">Gyakorlásom eredményei</h2>
      <button class="btn-outline no-print" onclick="closeHistoryModal()">✕</button>
    </div>
    
    <div id="historyListContainer"></div>

    <div class="button-group no-print" style="margin-top: 20px; justify-content: flex-end;">
      <button class="btn-primary" onclick="window.print()">Nyomtatás / Mentés PDF-be</button>
      <button class="btn-secondary" onclick="closeHistoryModal()">Bezárás</button>
    </div>
  </div>
</div>

<script>
  let currentTask = null;
  let practiceHistory = [];
  const lengthUnits = { 'mm': 0.1, 'cm': 1, 'dm': 10, 'm': 100 };

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function getRandomArrayElement(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  const pythagoreanTriplets = [
    [3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15], 
    [8, 15, 17], [10, 24, 26], [12, 16, 20], [15, 20, 25]
  ];

  function generateTask() {
    const shapeTypeSelect = document.getElementById('shapeType').value;
    const calcGoal = document.getElementById('calcGoal').value;

    let shape = shapeTypeSelect;
    if (shape === 'random') {
      const shapes = ['right_triangle', 'isosceles_triangle', 'square', 'rectangle', 'trapezoid', 'rhombus_deltoid', 'parallelogram', 'circle'];
      shape = getRandomArrayElement(shapes);
    }

    currentTask = buildPythagorasTask(shape, calcGoal);
    renderTask();
  }

  function buildPythagorasTask(shape, goal) {
    let task = {
      shape: shape,
      targetInputs: [],
      solutionRaw: {},
      text: "",
      steps: "",
      checked: false,
      isCorrect: false
    };

    let u = getRandomArrayElement(['cm', 'dm', 'm']);
    
    if (shape === 'right_triangle') {
      let triplet = getRandomArrayElement(pythagoreanTriplets);
      let findHypotenuse = (goal === 'random') ? Math.random() > 0.5 : (goal === 'hypotenuse');

      if (findHypotenuse) {
        let a = triplet[0], b = triplet[1], c = triplet[2];
        task.text = `Adott egy derékszögű háromszög, amelynek befogói a = ${a} ${u} és b = ${b} ${u}. Számítsd ki az átfogó (c) hosszát!`;
        task.targetInputs = ['c'];
        task.solutionRaw = { c: { exact: c, unit: u, approx: c } };
        task.steps = `Pitagorasz-tétel alkalmazása: c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup><br>c<sup>2</sup> = ${a}<sup>2</sup> + ${b}<sup>2</sup> = ${a*a} + ${b*b} = ${c*c}<br>c = √(${c*c}) = ${c} ${u}`;
      } else {
        let a = triplet[0], b = triplet[1], c = triplet[2];
        task.text = `Adott egy derékszögű háromszög, amelynek átfogója c = ${c} ${u} és az egyik befogója a = ${a} ${u}. Számítsd ki a másik befogó (b) hosszát!`;
        task.targetInputs = ['b'];
        task.solutionRaw = { b: { exact: b, unit: u, approx: b } };
        task.steps = `Pitagorasz-tétel alkalmazása: b<sup>2</sup> = c<sup>2</sup> - a<sup>2</sup><br>b<sup>2</sup> = ${c}<sup>2</sup> - ${a}<sup>2</sup> = ${c*c} - ${a*a} = ${b*b}<br>b = √(${b*b}) = ${b} ${u}`;
      }
    }
    else if (shape === 'isosceles_triangle') {
      let triplet = getRandomArrayElement([[3,4,5], [5,12,13], [6,8,10]]);
      let halfBase = triplet[0];
      let height = triplet[1];
      let side = triplet[2];
      let base = 2 * halfBase;

      task.text = `Egy egyenlőszárú háromszög alapja c = ${base} ${u}, szára pedig a = ${side} ${u}. Számítsd ki az alaphoz tartozó magasságot (m<sub>c</sub>)!`;
      task.targetInputs = ['m'];
      task.solutionRaw = { m: { exact: height, unit: u, approx: height } };
      task.steps = `Az egyenlőszárú háromszög magassága felezi az alapot: f<sub>c</sub> = ${base} / 2 = ${halfBase} ${u}.<br>Pitagorasz-tétel a derékszögű fél-háromszögre: m<sub>c</sub><sup>2</sup> = a<sup>2</sup> - f<sub>c</sub><sup>2</sup><br>m<sub>c</sub><sup>2</sup> = ${side}<sup>2</sup> - ${halfBase}<sup>2</sup> = ${side*side} - ${halfBase*halfBase} = ${height*height}<br>m<sub>c</sub> = ${height} ${u}`;
    }
    else if (shape === 'square') {
      let a = getRandomInt(4, 12);
      let approxVal = parseFloat((a * Math.sqrt(2)).toFixed(2));

      task.text = `Adott egy négyzet, amelynek oldala a = ${a} ${u}. Számítsd ki az átlójának (d) hosszát!`;
      task.targetInputs = ['d'];
      // d = a * sqrt(2) -> gyök alatt 2*a^2
      task.solutionRaw = { d: { exactCoeff: a, exactRoot: 2, unit: u, approx: approxVal } };
      task.steps = `Négyzet átlója a Pitagorasz-tétellel: d<sup>2</sup> = a<sup>2</sup> + a<sup>2</sup> = 2 · a<sup>2</sup><br>d = a · √2 = ${a}√2 ≈ ${approxVal} ${u}`;
    }
    else if (shape === 'rectangle') {
      let triplet = getRandomArrayElement(pythagoreanTriplets);
      let a = triplet[0], b = triplet[1], d = triplet[2];

      task.text = `Egy téglalap oldalai a = ${a} ${u} és b = ${b} ${u}. Számítsd ki az átlójának (d) hosszát!`;
      task.targetInputs = ['d'];
      task.solutionRaw = { d: { exact: d, unit: u, approx: d } };
      task.steps = `Téglalap átlója: d<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup><br>d<sup>2</sup> = ${a}<sup>2</sup> + ${b}<sup>2</sup> = ${a*a} + ${b*b} = ${d*d}<br>d = √(${d*d}) = ${d} ${u}`;
    }
    else if (shape === 'trapezoid') {
      let triplet = getRandomArrayElement([[3,4,5], [5,12,13]]);
      let h = triplet[0], x = triplet[1], c = getRandomInt(5, 10);
      let a = c + 2 * x;
      let leg = triplet[2];

      task.text = `Egy egyenlőszárú trapéz alapjai a = ${a} ${u} és c = ${c} ${u}, magassága pedig m = ${h} ${u}. Számítsd ki a szár (s) hosszát!`;
      task.targetInputs = ['s'];
      task.solutionRaw = { s: { exact: leg, unit: u, approx: leg } };
      task.steps = `A trapéz szélére eső derékszögű háromszög befogói m = ${h} és (a - c) / 2 = (${a} - ${c}) / 2 = ${x}.<br>Pitagorasz-tétel a szárra: s<sup>2</sup> = m<sup>2</sup> + x<sup>2</sup> = ${h}<sup>2</sup> + ${x}<sup>2</sup> = ${leg*leg}<br>s = √(${leg*leg}) = ${leg} ${u}`;
    }
    else if (shape === 'rhombus_deltoid') {
      let triplet = getRandomArrayElement([[3,4,5], [5,12,13]]);
      let e_half = triplet[0], f_half = triplet[1], side = triplet[2];
      let e = 2 * e_half, f = 2 * f_half;

      task.text = `Egy rombusz átlói e = ${e} ${u} és f = ${f} ${u}. Számítsd ki a rombusz oldalának (a) hosszát!`;
      task.targetInputs = ['a'];
      task.solutionRaw = { a: { exact: side, unit: u, approx: side } };
      task.steps = `A rombusz átlói merőlegesen felezik egymást, így derékszögű háromszögeket kapunk befogókkal e / 2 = ${e_half} és f / 2 = ${f_half}.<br>a<sup>2</sup> = (${e} / 2)<sup>2</sup> + (${f} / 2)<sup>2</sup> = ${e_half*e_half} + ${f_half*f_half} = ${side*side}<br>a = √(${side*side}) = ${side} ${u}`;
    }
    else if (shape === 'parallelogram') {
      let triplet = getRandomArrayElement([[3,4,5], [5,12,13]]);
      let h = triplet[0], x = triplet[1], base_part = getRandomInt(4, 8);
      let a = base_part + x;
      let leg = triplet[2];

      task.text = `Egy paralelogramma (romboid) a = ${a} ${u}-s oldalához tartozó magasság m = ${h} ${u}, a magasság által az oldalon letörtszabott rövidebb szakasz x = ${x} ${u}. Számítsd ki a paralelogramma másik oldalának (b) hosszát!`;
      task.targetInputs = ['b'];
      task.solutionRaw = { b: { exact: leg, unit: u, approx: leg } };
      task.steps = `A magasság által levágott derékszögű háromszögből a b oldal az átfogó:<br>b<sup>2</sup> = m<sup>2</sup> + x<sup>2</sup> = ${h}<sup>2</sup> + ${x}<sup>2</sup> = ${leg*leg}<br>b = √(${leg*leg}) = ${leg} ${u}`;
    }
    else { 
      let triplet = getRandomArrayElement([[3,4,5], [6,8,10], [5,12,13]]);
      let r = triplet[2], d_center = triplet[0], half_chord = triplet[1];
      let chord = 2 * half_chord;

      task.text = `Egy r = ${r} ${u} sugarú körben a középponttól d = ${d_center} ${u} távolságra lévő húr hosszát (k) kell kiszámítani.`;
      task.targetInputs = ['k'];
      task.solutionRaw = { k: { exact: chord, unit: u, approx: chord } };
      task.steps = `A sugár, a távolság és a húr fele derékszögű háromszöget alkot.<br>Fél húr: x<sup>2</sup> = r<sup>2</sup> - d<sup>2</sup> = ${r}<sup>2</sup> - ${d_center}<sup>2</sup> = ${half_chord*half_chord} -> x = ${half_chord} ${u}.<br>A teljes húr: k = 2 · x = 2 · ${half_chord} = ${chord} ${u}`;
    }

    return task;
  }

  function renderTask() {
    if (!currentTask) return;

    document.getElementById('taskTitle').innerText = `Pitagorasz-feladat (${getShapeName(currentTask.shape)})`;
    document.getElementById('taskText').innerHTML = currentTask.text;
    
    renderSvg(currentTask.shape);

    const inputsGrid = document.getElementById('inputsGrid');
    inputsGrid.innerHTML = '';
    const useRoot = document.getElementById('useRootFormat').checked;

    currentTask.targetInputs.forEach(key => {
      const box = document.createElement('div');
      box.className = 'input-box';

      const label = document.createElement('label');
      label.innerText = `Keresett érték (${key}):`;

      const wrap = document.createElement('div');
      wrap.className = 'input-with-unit';

      if (useRoot) {
        // Gyökös alak beviteli mezői: [külső szám] √ [gyök alatti szám]
        const rootDiv = document.createElement('div');
        rootDiv.className = 'root-input-wrapper';

        const coeffInput = document.createElement('input');
        coeffInput.type = 'number';
        coeffInput.step = 'any';
        coeffInput.id = `input_${key}_coeff`;
        coeffInput.placeholder = '1';

        const rootSign = document.createElement('span');
        rootSign.innerHTML = '√';
        rootSign.style.fontWeight = 'bold';

        const underRootInput = document.createElement('input');
        underRootInput.type = 'number';
        underRootInput.step = 'any';
        underRootInput.id = `input_${key}_root`;
        underRootInput.placeholder = 'szám';

        rootDiv.appendChild(coeffInput);
        rootDiv.appendChild(rootSign);
        rootDiv.appendChild(underRootInput);
        wrap.appendChild(rootDiv);
      } else {
        const input = document.createElement('input');
        input.type = 'number';
        input.step = 'any';
        input.id = `input_${key}`;
        input.placeholder = 'Érték...';
        wrap.appendChild(input);
      }

      const select = document.createElement('select');
      select.id = `unit_${key}`;
      ['cm', 'dm', 'm', 'mm'].forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.innerText = u;
        select.appendChild(opt);
      });

      wrap.appendChild(select);
      box.appendChild(label);
      box.appendChild(wrap);
      inputsGrid.appendChild(box);
    });

    const fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';
  }

  function renderSvg(shape) {
    const svg = document.getElementById('shapeSvg');
    let content = '';
    const stroke = "#2b5c8f";
    const fill = "#e8f1f5";

    switch(shape) {
      case 'right_triangle':
        content = `<polygon points="70,130 230,130 70,40" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
                   <rect x="70" y="110" width="20" height="20" fill="none" stroke="${stroke}" stroke-width="2"/>`;
        break;
      case 'isosceles_triangle':
        content = `<polygon points="150,30 70,130 230,130" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
                   <line x1="150" y1="30" x2="150" y2="130" stroke="${stroke}" stroke-width="2" stroke-dasharray="5,5"/>`;
        break;
      case 'square':
      case 'rectangle':
        content = `<rect x="70" y="40" width="160" height="90" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
                   <line x1="70" y1="40" x2="230" y2="130" stroke="${stroke}" stroke-width="2" stroke-dasharray="5,5"/>`;
        break;
      case 'parallelogram':
        content = `<polygon points="90,120 230,120 210,50 70,50" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
                   <line x1="70" y1="50" x2="70" y2="120" stroke="${stroke}" stroke-width="2" stroke-dasharray="5,5"/>`;
        break;
      case 'circle':
        content = `<circle cx="150" cy="85" r="55" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
                   <line x1="150" y1="85" x2="205" y2="85" stroke="${stroke}" stroke-width="2"/>
                   <line x1="110" y1="125" x2="190" t1="125" x2="190" y2="125" stroke="#f57c00" stroke-width="2" stroke-dasharray="4,4"/>
                   <line x1="150" y1="85" x2="150" y2="125" stroke="${stroke}" stroke-width="2" stroke-dasharray="3,3"/>`;
        break;
      default:
        content = `<polygon points="100,30 200,30 240,130 60,130" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
        break;
    }
    svg.innerHTML = content;
  }

  function checkAnswer() {
    if (!currentTask) return;

    let isCorrect = true;
    let userAnswers = {};
    const fb = document.getElementById('feedback');
    const useRoot = document.getElementById('useRootFormat').checked;
    
    currentTask.targetInputs.forEach(key => {
      const userUnit = document.getElementById(`unit_${key}`).value;
      let userValInBase = 0;

      if (useRoot) {
        const coeff = parseFloat(document.getElementById(`input_${key}_coeff`).value) || 1;
        const underRoot = parseFloat(document.getElementById(`input_${key}_root`).value);

        if (isNaN(underRoot)) {
          isCorrect = false;
          userAnswers[key] = 'Hiányos adat';
          return;
        }

        userAnswers[key] = `${coeff !== 1 ? coeff : ''}√${underRoot} ${userUnit}`;
        // Kiszámítjuk a decimális értékét az ellenőrzéshez (pl. 1.41 * ... vagy alapérték)
        let evaluated = coeff * Math.sqrt(underRoot);
        userValInBase = evaluated * lengthUnits[userUnit];
      } else {
        const userVal = parseFloat(document.getElementById(`input_${key}`).value);
        userAnswers[key] = isNaN(userVal) ? 'Nincs megadva' : `${userVal} ${userUnit}`;

        if (isNaN(userVal)) {
          isCorrect = false;
          return;
        }
        userValInBase = userVal * lengthUnits[userUnit];
      }

      let solObj = currentTask.solutionRaw[key];
      let targetValInBase = 0;

      if (solObj.exactCoeff !== undefined) {
        // Pl négyzet átlója: a * sqrt(2)
        targetValInBase = solObj.exactCoeff * Math.sqrt(solObj.exactRoot) * lengthUnits[solObj.unit];
      } else {
        targetValInBase = solObj.exact * lengthUnits[solObj.unit];
      }

      if (Math.abs(userValInBase - targetValInBase) > 0.15) {
        isCorrect = false;
      }
    });

    currentTask.checked = true;
    currentTask.isCorrect = isCorrect;
    currentTask.userAnswers = userAnswers;

    if (!practiceHistory.includes(currentTask)) {
      practiceHistory.push(currentTask);
    }

    if (isCorrect) {
      fb.className = 'feedback success';
      fb.innerHTML = `<strong>Helyes válasz! Kiváló munka! 🎉</strong><div class="solution-steps"><strong>Részletes levezetés:</strong><br>${currentTask.steps}</div>`;
    } else {
      fb.className = 'feedback error';
      fb.innerHTML = `<strong>Sajnos a válasz helytelen. Próbáld újra! 💡</strong><div class="solution-steps"><strong>Segítség / Útmutató:</strong><br>${currentTask.steps}</div>`;
    }
  }

  function resetForm() {
    document.getElementById('studentName').value = '';
    document.getElementById('shapeType').value = 'random';
    document.getElementById('calcGoal').value = 'random';
    document.getElementById('useRootFormat').checked = false;
    practiceHistory = [];
    generateTask();
  }

  function openHistoryModal() {
    const studentName = document.getElementById('studentName').value || 'Tanuló';
    document.getElementById('modalStudentName').innerText = `${studentName} - Gyakorlásom eredményei`;

    const container = document.getElementById('historyListContainer');
    
    if (practiceHistory.length === 0) {
      container.innerHTML = '<p>Még nem ellenőriztél egyetlen feladatot sem.</p>';
    } else {
      let tableHtml = `
        <table class="history-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Feladat</th>
              <th>Megadott válasz</th>
              <th>Eredmény</th>
            </tr>
          </thead>
          <tbody>
      `;

      practiceHistory.forEach((item, index) => {
        let answersText = Object.entries(item.userAnswers)
          .map(([k, v]) => `${k} = ${v}`)
          .join(', ');

        tableHtml += `
          <tr>
            <td>${index + 1}</td>
            <td>${item.text}</td>
            <td>${answersText}</td>
            <td class="${item.isCorrect ? 'tag-success' : 'tag-error'}">
              ${item.isCorrect ? 'Helyes' : 'Hibás'}
            </td>
          </tr>
        `;
      });

      tableHtml += '</tbody></table>';
      container.innerHTML = tableHtml;
    }

    document.getElementById('historyModal').style.display = 'flex';
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  function getShapeName(shape) {
    const names = {
      'right_triangle': 'Derékszögű háromszög',
      'isosceles_triangle': 'Egyenlőszárú háromszög',
      'square': 'Négyzet (átló)',
      'rectangle': 'Téglalap (átló)',
      'trapezoid': 'Trapéz',
      'rhombus_deltoid': 'Rombusz / Deltoid',
      'parallelogram': 'Paralelogramma (Romboid)',
      'circle': 'Kör (húr)'
    };
    return names[shape] || 'Geometriai alakzat';
  }

  window.onload = function() {
    generateTask();
  };
</script>
